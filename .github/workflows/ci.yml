name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer,Pester -Scope CurrentUser -Force
          Get-ChildItem scripts -Recurse -Filter *.ps1 | ForEach-Object {$t=$null;$e=$null;[void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$t,[ref]$e);if($e.Count){throw "Parse error: $($_.FullName)"};Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error,Warning}
      - shell: pwsh
        run: Invoke-Pester ./tests/PowerShell -CI -Output Detailed
      - shell: bash
        run: bash tests/bash/repository_tests.sh
